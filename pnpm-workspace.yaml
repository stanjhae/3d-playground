# The web app (apps/web), the internal admin (apps/admin) and shared code
# (packages/*). Supabase migrations, docs and CI stay at the root.
packages:
  - apps/*
  - packages/*

# Install scripts that are deliberately not run. core-js (from posthog-js,
# docs/analytics.md) only prints a funding banner on install.
allowBuilds:
  core-js: false

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (17 Nov 2026), no patched release yet. Build tooling only
    # (Vite, Tailwind, tinyglobby): nothing in production depends on it and it
    # never sees user input. Remove once a fixed picomatch ships.
    - GHSA-fc5q-39xc-vjpf
