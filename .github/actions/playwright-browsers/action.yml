name: Playwright browsers
description: Installs one Playwright browser, cached by Playwright version; its system packages are installed every run, and an apt outage only warns.
inputs:
  browser:
    description: chromium or webkit
    required: true
runs:
  using: composite
  steps:
    - name: Playwright version
      id: version
      shell: bash
      run: echo "version=$(pnpm --filter @flv/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-ubuntu-24.04-${{ steps.version.outputs.version }}-${{ inputs.browser }}
    - uses: ./.github/actions/apt-mirror
    # The browser itself comes from Playwright's own download server (cached).
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @flv/web exec playwright install ${{ inputs.browser }}
    # Its system packages come from Ubuntu's apt servers, which can be
    # unreachable for hours (19 Nov: the Azure mirror and archive.ubuntu.com
    # both down), failing every browser job before a test ran. Retry, then
    # carry on with a warning: the runner image already has Chrome's
    # libraries, and one really missing fails the tests at browser launch
    # with a clear error instead.
    - shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm --filter @flv/web exec playwright install-deps ${{ inputs.browser }}; then
            exit 0
          fi
          echo "::warning::Installing ${{ inputs.browser }} system packages failed (attempt $attempt of 3); retrying in 30 s."
          sleep 30
        done
        echo "::warning::Ubuntu apt servers stayed unreachable: running ${{ inputs.browser }} with the runner image's own libraries."
