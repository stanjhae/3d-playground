name: Start Supabase
description: Installs dependencies and starts only the Supabase services the API and tests use.
runs:
  using: composite
  steps:
    # Supabase's ports (54321 and up) sit in Linux's range for outgoing
    # connections, so any process could already hold one, and retrying on the
    # same machine doesn't help. Move that range clear before anything runs.
    - name: Keep Supabase's ports free
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # The version comes from package.json `packageManager`.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    # A pinned version: "latest" asks GitHub's API every run, and a run
    # failed on its rate limit before any test ran.
    - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
      with:
        version: 2.117.0
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Only the services the API and tests use: Postgres, auth, REST,
    # storage, the gateway and Mailpit.
    # Docker on the runner sometimes fails to bring up a container, so retry
    # this step alone, clearing any half-started stack between tries.
    - name: Start Supabase
      shell: bash
      run: |
        for try in 1 2 3; do
          supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta && exit 0
          echo "::warning::supabase start failed on try $try of 3"
          if [ "$try" -lt 3 ]; then supabase stop --no-backup || true; fi
        done
        exit 1
