name: Reachable apt mirror
description: Points apt at archive.ubuntu.com when the runner's Azure Ubuntu mirror does not resolve, so a mirror outage does not fail setup. Does nothing when the mirror is healthy.
runs:
  using: composite
  steps:
    - name: Fall back from an unreachable Azure apt mirror
      shell: bash
      run: |
        if getent hosts azure.archive.ubuntu.com > /dev/null; then
          exit 0
        fi
        echo "::warning::azure.archive.ubuntu.com does not resolve; using archive.ubuntu.com for apt."
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        fi
        sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
          -exec sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' {} +
