# Release gate for master (Q07 #192). Every job must pass before merging,
# except WebKit smoke, which reports but never blocks (Q2).
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # The version comes from package.json `packageManager`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # Known high or critical advisories in any dependency fail the run
      # (P4). Dependabot (.github/dependabot.yml) proposes the updates.
      - name: Dependency audit
        run: pnpm audit --audit-level high
      # `pnpm build` runs route generation, tsc and the Vite build.
      - run: pnpm build
      # Byte budgets (R06 #169, P4): all JS and the largest chunk (gzip),
      # and each garment GLB. Limits are in scripts/budgets.json, with
      # headroom over docs/baseline.md; raise them there, on purpose. The
      # editor's first-load and frame budgets run in e2e/budgets.spec.ts.
      - name: Byte budgets
        run: node scripts/check-budgets.mjs
      - run: pnpm test

  database:
    name: Database and API integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/start-supabase
      - run: supabase test db
      - name: API integration tests
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          pnpm test:integration

  # Browser journey (Q04 #189), in three parts so each stays well inside the
  # limit as tests are added. Each part has its own Supabase stack and tests
  # the production build (`pnpm build` + `pnpm preview`, Q2); see docs/e2e.md.
  browser:
    name: Browser journey tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Setup alone can take 7 minutes when the runner's packages are slow.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/start-supabase
      - uses: ./.github/actions/playwright-browsers
        with:
          browser: chromium
      - name: Browser journey tests
        env:
          E2E_SERVER: preview
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL"
          pnpm e2e --shard=${{ matrix.shard }}/3
      # A missing baseline is written, not compared, so a retry would pass
      # without one. Fail instead, and upload what was written to commit.
      - name: Visual baselines are committed
        if: always()
        run: |
          written=$(git status --porcelain --untracked-files=all e2e/__screenshots__)
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error::Visual baselines were missing and have been written. Commit them from the playwright-report artifact (docs/e2e.md)."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 7

  # WebKit smoke (Q2): non-blocking until WebGL2 is proven in WebKit on
  # Linux. A failure shows as a warning on a passing job.
  webkit:
    name: WebKit smoke (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/start-supabase
      - uses: ./.github/actions/playwright-browsers
        with:
          browser: webkit
      - name: WebKit smoke
        id: smoke
        continue-on-error: true
        env:
          E2E_SERVER: preview
          E2E_WEBKIT: '1'
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL"
          pnpm e2e --project=webkit-smoke
      - name: Report
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "WebKit smoke passed: WebGL2 works in WebKit on Linux." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::WebKit smoke failed (non-blocking). See the webkit-report artifact."
            echo "WebKit smoke failed (non-blocking until WebGL2 is proven on Linux)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.smoke.outcome == 'failure'
        with:
          name: webkit-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
