# Release gate for master (Q07 #192). Every job must pass before merging,
# except WebKit smoke, which reports but never blocks (Q2).
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` runs route generation, tsc and the Vite build.
      - run: pnpm build
      # Renderer budget (R06 #169). Limits are gzip KiB with about 15%
      # headroom over docs/baseline.md; raise them there first, on purpose.
      - name: Bundle size budget
        env:
          JS_TOTAL_KIB: 570
          JS_CHUNK_KIB: 310
        run: |
          node --input-type=module -e '
          import { readdirSync, readFileSync } from "node:fs"
          import { gzipSync } from "node:zlib"
          const dir = "dist/assets"
          const kib = (n) => n / 1024
          const chunks = readdirSync(dir)
            .filter((f) => f.endsWith(".js"))
            .map((f) => ({ f, size: kib(gzipSync(readFileSync(`${dir}/${f}`)).length) }))
          const total = chunks.reduce((sum, c) => sum + c.size, 0)
          const largest = chunks.reduce((a, c) => (c.size > a.size ? c : a))
          const totalLimit = Number(process.env.JS_TOTAL_KIB)
          const chunkLimit = Number(process.env.JS_CHUNK_KIB)
          console.log(`JS gzip total ${total.toFixed(1)} KiB (budget ${totalLimit})`)
          console.log(`Largest chunk ${largest.f} ${largest.size.toFixed(1)} KiB (budget ${chunkLimit})`)
          if (total > totalLimit || largest.size > chunkLimit) {
            console.error("::error::JS bundle over budget. See docs/baseline.md (#169).")
            process.exit(1)
          }
          '
      - run: pnpm test

  database:
    name: Database and API integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-supabase
      - run: supabase test db
      - name: API integration tests
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          pnpm test:integration
      # The nightly backup's own script (backup.yml), run against this stack
      # over a connection URL: dump, restore check, encrypt, then decrypt
      # with the throwaway key and check the copy again (P1).
      - uses: ./.github/actions/postgres-client
      - name: Encrypted backup round trip
        shell: bash
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SECRET_KEY)=')"
          db="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"
          export SOURCE_SUPABASE_URL="$API_URL" SOURCE_SUPABASE_SECRET_KEY="$SECRET_KEY" SOURCE_SUPABASE_DB_URL="$db"
          export CHECK_SUPABASE_URL="$API_URL" CHECK_SUPABASE_SECRET_KEY="$SECRET_KEY" CHECK_SUPABASE_DB_URL="$db"
          age-keygen -o "$RUNNER_TEMP/backup.key" 2> /dev/null
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/backup.key")"
          scripts/backup-encrypted.sh "$RUNNER_TEMP/flp-ci"
          # No plaintext is left behind, and the archive matches its checksum.
          test ! -e "$RUNNER_TEMP/flp-ci"
          (cd "$RUNNER_TEMP" && sha256sum --check flp-ci.tar.age.sha256)
          age --decrypt --identity "$RUNNER_TEMP/backup.key" "$RUNNER_TEMP/flp-ci.tar.age" | tar -C "$RUNNER_TEMP" -xf -
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" SUPABASE_DB_URL="$db" \
            node scripts/restore-check.mjs "$RUNNER_TEMP/flp-ci" --verify-only
          rm -rf "$RUNNER_TEMP/flp-ci" "$RUNNER_TEMP/backup.key"

  # Browser journey (Q04 #189), in three parts so each stays well inside the
  # limit as tests are added. Each part has its own Supabase stack and tests
  # the production build (`pnpm build` + `pnpm preview`, Q2); see docs/e2e.md.
  browser:
    name: Browser journey tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Setup alone can take 7 minutes when the runner's packages are slow.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-supabase
      - uses: ./.github/actions/playwright-browsers
        with:
          browser: chromium
      - name: Browser journey tests
        env:
          E2E_SERVER: preview
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL"
          pnpm e2e --shard=${{ matrix.shard }}/3
      # A missing baseline is written, not compared, so a retry would pass
      # without one. Fail instead, and upload what was written to commit.
      - name: Visual baselines are committed
        if: always()
        run: |
          written=$(git status --porcelain --untracked-files=all e2e/__screenshots__)
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error::Visual baselines were missing and have been written. Commit them from the playwright-report artifact (docs/e2e.md)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 7

  # WebKit smoke (Q2): non-blocking until WebGL2 is proven in WebKit on
  # Linux. A failure shows as a warning on a passing job.
  webkit:
    name: WebKit smoke (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-supabase
      - uses: ./.github/actions/playwright-browsers
        with:
          browser: webkit
      - name: WebKit smoke
        id: smoke
        continue-on-error: true
        env:
          E2E_SERVER: preview
          E2E_WEBKIT: '1'
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL"
          pnpm e2e --project=webkit-smoke
      - name: Report
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "WebKit smoke passed: WebGL2 works in WebKit on Linux." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::WebKit smoke failed (non-blocking). See the webkit-report artifact."
            echo "WebKit smoke failed (non-blocking until WebGL2 is proven on Linux)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.smoke.outcome == 'failure'
        with:
          name: webkit-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
