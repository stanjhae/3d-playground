# Release gate for master (Q07 #192). Both jobs must pass before merging.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` runs route generation, tsc and the Vite build.
      - run: pnpm build
      - run: pnpm test

  database:
    name: Database and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Only the services the API and tests use: Postgres, auth, REST,
      # storage, the gateway and Mailpit.
      - run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: supabase test db
      - name: API integration tests
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          pnpm test:integration
